#
# CodeQL code scanning (advanced setup).
#
# This repository is an Android/Kotlin Gradle project with a `common` git
# submodule, so CodeQL's default-setup autobuild cannot build it unassisted:
#   * Kotlin is only analyzed when the code is actually built (build-mode: none
#     would analyze Java only), so a real build is required.
#   * `common` must be checked out as a submodule (the app depends on `:common`).
#   * The tracked gradle.properties pins org.gradle.java.home to a Windows-only
#     path, which is invalid on Linux runners.
#
# This workflow therefore uses `build-mode: manual` with explicit build steps.
# Default setup must be disabled for it to run:
#   Settings -> Code security and analysis -> Code scanning -> CodeQL analysis
#   -> (default setup) Disable, then commit this workflow.
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so new queries are applied to unchanged code.
    - cron: "23 3 * * 1"
  workflow_dispatch:

# Least privilege by default; the analyze job re-adds security-events: write.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # Pin the runner image so the toolchain does not shift under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The app depends on the `common` submodule; it must be present to build.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build debug APK
        run: |
          # gradle.properties hardcodes org.gradle.java.home to a Windows-only
          # path. Remove it so Gradle uses the JDK installed above.
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          # No daemon / no configuration cache / in-process Kotlin so CodeQL can
          # observe the Kotlin compiler during the build.
          ./gradlew --no-daemon --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            clean :app:assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
